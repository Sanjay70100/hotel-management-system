# =========================================================
# Application
# =========================================================

spring.application.name=hotel-management-system

server.port=8080


# =========================================================
# PostgreSQL Database
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_management
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# JSON
# =========================================================

spring.jackson.serialization.write-dates-as-timestamps=false


# =========================================================
# Validation
# =========================================================

spring.mvc.throw-exception-if-no-handler-found=true


# =========================================================
# JWT Configuration
# =========================================================

app.jwt.secret=hotel-management-system-secret-key-change-this-in-production-please-use-a-long-random-secret-key
app.jwt.expiration=86400000


# =========================================================
# Logging
# =========================================================

logging.level.com.hotelmanagement=INFO
logging.level.org.springframework.security=INFO
