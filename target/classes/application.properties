# =========================================================
# APPLICATION
# =========================================================

spring.application.name=hotel-management-system

server.port=8080


# =========================================================
# DATABASE CONFIGURATION
# =========================================================
# Default: High-speed In-Memory Database (Instant zero-install setup)
# Runs out-of-the-box without requiring external PostgreSQL installed!
spring.datasource.url=jdbc:h2:mem:hotel_management;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# To switch to PostgreSQL later, comment the H2 lines above and uncomment below:
# spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_management
# spring.datasource.username=postgres
# spring.datasource.password=YOUR_POSTGRESQL_PASSWORD
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# JSON
# =========================================================

spring.jackson.serialization.write-dates-as-timestamps=false


# =========================================================
# SWAGGER / OPENAPI
# =========================================================

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework=INFO

logging.level.com.hotelmanagement=DEBUG